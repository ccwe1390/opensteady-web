name: checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  unit:
    name: Unit, package, benchmark, fault check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['20', '22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm test
      - run: npm run check
      - name: Benchmark (replay is seeded; output is compared, not committed)
        run: |
          npm run benchmark -- --out "$RUNNER_TEMP/benchmark.json"
          python3 benchmark/analyze.py "$RUNNER_TEMP/benchmark.json"
      - run: node tools/mutation_check.cjs
      - run: python3 tools/contrast.py
      - name: Packages build reproducibly
        run: |
          python3 tools/package.py
          cp dist/SHA256SUMS.txt "$RUNNER_TEMP/first.txt"
          rm -rf dist && python3 tools/package.py
          diff "$RUNNER_TEMP/first.txt" dist/SHA256SUMS.txt
  browser:
    name: Installed extension in Chromium
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run test:review-links
      - name: Keep the run's evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-results
          path: |
            results/browser.json
            results/review-links.json
            results/lab.png
